[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cutccc"
version = "0.3.0"
description = "Node.js video editing service with local Python subtitle inference workers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "cutccc contributors"}]
keywords = ["subtitles", "asr", "qwen", "chinese", "offline"]
dependencies = []

[project.optional-dependencies]
inference = ["qwen-asr==0.0.6", "numpy>=1.26,<3", "soundfile>=0.12", "silero-vad==6.2.3"]
web = []
mcp = []
test = ["numpy>=1.26,<3", "mcp>=1.20,<2"]

[project.scripts]
cutccc = "cutccc.cli:main"

[project.urls]
Homepage = "https://github.com/wzj998/cutccc"
Issues = "https://github.com/wzj998/cutccc/issues"

[tool.setuptools.packages.find]
include = ["cutccc*"]

[tool.setuptools.package-data]
cutccc = ["web/*.html", "web/*.css", "web/*.js", "node/*.js", "node/package.json"]
