[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cutccc"
version = "0.2.0"
description = "Local video editing and Chinese subtitles through a web UI, HTTP API and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "cutccc contributors"}]
keywords = ["subtitles", "asr", "qwen", "chinese", "offline"]
dependencies = []

[project.optional-dependencies]
inference = ["qwen-asr==0.0.6", "numpy>=1.26,<3", "soundfile>=0.12"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "filelock>=3.15"]
mcp = ["mcp>=1.20,<2"]
test = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "httpx>=0.27,<1", "mcp>=1.20,<2", "filelock>=3.15"]

[project.scripts]
cutccc = "cutccc.cli:main"

[project.urls]
Homepage = "https://github.com/wzj998/cutccc"
Issues = "https://github.com/wzj998/cutccc/issues"

[tool.setuptools.packages.find]
include = ["cutccc*"]

[tool.setuptools.package-data]
cutccc = ["web/*.html", "web/*.css", "web/*.js"]
